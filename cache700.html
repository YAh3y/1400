<!DOCTYPE html><html manifest="700.manifest"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتب يحيى للإلكترونيات | Offline Cache</title><link rel="stylesheet" href="style.css"></head><body><script>
history.replaceState(null,null,'index.html');
function DLProgress(e){var pc=e.total?Math.round(e.loaded/e.total*100):0;window.msgs.innerHTML="تثبيت ملفات الأوفلاين: "+pc+"%";}
function done(){window.msgs.innerHTML="تم تثبيت الأوفلاين بنجاح ✔<br>يمكنك إطفاء الإنترنت وفتح الصفحة من جديد.";}

window.applicationCache.oncached=done; window.applicationCache.onupdateready=done;
window.applicationCache.onerror=function(){window.msgs.innerHTML="تعذر تثبيت الكاش. امسح بيانات المتصفح وافتح الصفحة بالإنترنت مرة واحدة.";};
